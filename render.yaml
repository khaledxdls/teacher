# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the API (Docker) and a managed PostgreSQL database.
databases:
  - name: classpilot-db
    plan: basic-256mb
    databaseName: classpilot

services:
  - type: web
    name: classpilot-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: classpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
